<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Work Solute — Login</title><link rel="stylesheet" href="shared.css"></head>
<body class="sf-login-page"><div class="sf-login-wrap"><div class="sf-login-card"><img src="assets/sahayak-logo.svg" alt="Work Solute" class="sf-login-logo"><h1>Federation Administration</h1><p>Secure access to cooperative society governance, welfare, finance and workforce intelligence.</p><form id="loginForm"><label>Email<input name="email" type="email" value="admin@sahayak.coop" required></label><label>Password<input name="password" type="password" value="admin123" required></label><button type="submit">Sign in</button><div id="loginError" class="sf-login-error"></div></form><small>Demo administrator: admin@sahayak.coop / admin123</small></div></div><script>
const form=document.getElementById('loginForm'); form.addEventListener('submit',async e=>{e.preventDefault();const b={email:form.email.value,password:form.password.value};const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});if(r.ok)location.href='/pages/overview.html';else document.getElementById('loginError').textContent=(await r.json()).detail||'Login failed';});
</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Service Request</title><link rel="stylesheet" href="app.css"><script src="shared.js"></script></head><body><div class="shell"><aside class="side"><div class="brand"><img src="coop_labour_society_logo/logo.svg"><div><b>Perur Workers<br>Cooperative Society</b><small>Service Requests</small></div></div><nav class="nav"><a href="customer.html">← Customer Dashboard</a><a class="active" href="booking-create.html">＋ New Request</a><a href="invoice.html">▤ Invoices</a></nav></aside><main class="main"><div class="top"><div><div class="eyebrow">Service Request</div><h1 class="title" id="heading">Request a Household Service</h1></div></div><form id="form" class="card"><div class="formgrid"><div class="field"><label>Customer name</label><input value="Anita Rao" required></div><div class="field"><label>Customer type</label><select id="type"><option value="Household">Household</option><option value="Institutional">Institutional</option></select></div><div class="field"><label>Required domain / skill</label><select id="domain"><option>Electrician</option><option>Plumber</option><option>Carpenter</option><option>Cleaner</option><option>Technician</option><option>Domestic Helper</option></select></div><div class="field"><label>Required workers</label><input id="count" type="number" min="1" value="1"></div><div class="field"><label>Date</label><input id="date" type="date" required></div><div class="field"><label>Time</label><input type="time" value="10:30" required></div><div class="field span2"><label>Onsite service?</label><select id="onsite"><option value="yes">Yes — location required</option><option value="no">No — remote / workshop service</option></select></div><div class="field span2" id="loc"><label>Service location</label><input value="Perur, Coimbatore district" placeholder="Area, locality, landmark"></div><div class="field span2"><label>Requirements / problem description</label><textarea placeholder="Describe the work needed"></textarea></div></div><div class="notice" style="margin-top:16px">Institutional bookings should normally be submitted on the previous day. Large-volume requests will be reviewed by the cooperative before worker allocation.</div><button class="btn primary" style="margin-top:18px">Submit Request</button></form></main></div><script>const q=new URLSearchParams(location.search);if(q.get('type')==='institutional'){type.value='Institutional';heading.textContent='Create Institutional Labour Booking';count.value=10}const d=new Date();d.setDate(d.getDate()+1);date.value=d.toISOString().slice(0,10);type.onchange=()=>heading.textContent=type.value==='Institutional'?'Create Institutional Labour Booking':'Request a Household Service';onsite.onchange=()=>loc.style.display=onsite.value==='yes'?'block':'none';form.addEventListener('submit',e=>{e.preventDefault();const s=state();const id='JOB-2026-'+String(1843+s.jobs.length).padStart(5,'0');s.jobs.unshift({id,type:type.value,customer:'Anita Rao',domain:domain.value,location:onsite.value==='yes'?'Perur, Coimbatore':'Remote / Workshop',date:date.value,time:'10:30',workers:[],status:'Pending Review',amount:type.value==='Institutional'?Number(count.value)*650:1450,fee:50});save(s);alert('Request '+id+' submitted to the cooperative society.');go('customer.html')})</script></body></html>

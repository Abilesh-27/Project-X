<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications</title><link rel="stylesheet" href="app.css"><script src="shared.js"></script></head><body><div class="shell"><aside class="side"><div class="brand"><img src="coop_labour_society_logo/logo.svg"><div><b>Perur Workers<br>Cooperative Society</b><small>Notifications</small></div></div><nav class="nav"><a href="customer.html">← Dashboard</a><a class="active" href="notifications.html">◉ Notifications</a></nav></aside><main class="main"><div class="top"><div><div class="eyebrow">Alerts & updates</div><h1 class="title">Notifications</h1></div><button class="btn secondary" onclick="toast('All notifications marked as read')">Mark all read</button></div><div id="list"></div></main></div><script>const s=state();list.innerHTML=s.notifications.map(n=>`<div class="card" style="margin-bottom:10px"><b>${n.text}</b><p class="label">${n.time} · ${n.unread?'<span class="badge blue">New</span>':'Read'}</p></div>`).join('')</script></body></html>

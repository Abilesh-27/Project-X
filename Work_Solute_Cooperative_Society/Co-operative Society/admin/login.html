<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | Perur Workers Co-operative Scociety</title><link rel="stylesheet" href="app.css"><script src="shared.js"></script></head><body><div class="login"><div class="loginbox"><div style="text-align:center"><img src="coop_labour_society_logo/logo.svg" width="52"><h2>Sign in</h2><p class="label">Perur Workers Co-operative Scociety</p></div><form id="loginForm" style="margin-top:22px"><div class="field"><label>Email / User ID</label><input required value="admin@perurcoop.in"></div><div class="field" style="margin-top:12px"><label>Password</label><input required type="password" value="demo123"></div><div class="field" style="margin-top:12px"><label>Role</label><select id="role"><option value="admin">Cooperative Administrator</option><option value="household">Household Customer</option><option value="institutional">Institutional Customer</option><option value="worker">Worker</option></select></div><button class="btn primary" style="width:100%;margin-top:18px">Sign in</button></form><p class="label" style="margin-top:15px">Demo authentication uses local browser state; connect your identity provider/API for production credentials.</p></div></div><script>const q=new URLSearchParams(location.search);if(q.get('role'))document.querySelector('#role').value=q.get('role');document.querySelector('#loginForm').addEventListener('submit',e=>{e.preventDefault();const r=document.querySelector('#role').value;if(r==='admin')go('executive_overview_dashboard/index.html');else if(r==='worker')go('worker.html');else go('customer.html?type='+r)})</script></body></html>
